; PlatformIO — Waypost Scout (LilyGO T-Deck)
; Product: Waypost Scout. Internal protocol device class: Pocket (node_id prefix pocket-*).
;
; Flash:   pio run -e tdeck -t upload --upload-port /dev/ttyACM0
; Monitor: pio device monitor -p /dev/ttyACM0 -b 115200
;
; Do not flash Heltec boards on /dev/ttyUSB* with this project — see firmware/outpost.

[platformio]
boards_dir = boards
default_envs = tdeck

[env:tdeck]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_type = debug
board_build.partitions = boards/scout_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -Wall
  -Wno-missing-field-initializers
  -Wno-format
  -DRNS_USE_FS
  -DUSTORE_USE_LITTLEFS
  -DMSGPACK_USE_BOOST=OFF
  -DBOARD_HAS_PSRAM=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_TDECK
  -DWAYPOST_POCKET_ID=\"pocket-1\"
  ; Station ReticulumTransport.destination_hash_hex (lab dev Station)
  -DWAYPOST_STATION_DEST_HASH=\"70a798ca48cfc9e8993fd3442c0ec50c\"
  ; Who the Scout belongs to and who it can message come from Station
  ; (pairing / WHOAMI, ROLL_LIST), not build flags.
  ; USB-serial remote control (dev/debug); -DWAYPOST_USB_REMOTE=0 for field builds.
  -include include/tdeck_tft_setup.h
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  ArduinoJson@^7.4.2
  MsgPack@^0.4.2
  jgromes/RadioLib@^7.0.0
  https://github.com/attermann/Crypto.git
  https://github.com/attermann/microStore.git
monitor_filters = esp32_exception_decoder
