; Waypost Scout firmware — rebuilt 2026-10-05 (docs/scout-firmware-architecture.md).
; Replaces firmware/pocket once it does everything pocket does.
;
; Flash:   pio run -e tdeck -t upload --upload-port /dev/ttyACM0
; Monitor: pio device monitor -p /dev/ttyACM0 -b 115200
;
; Same board, partition table and file names as firmware/pocket, so flashing
; keeps the Scout's radio identity, account and saved messages.

[platformio]
boards_dir = boards
default_envs = tdeck

[env:tdeck]
platform = espressif32@6.3.0
board = T-Deck
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_type = debug
board_build.partitions = boards/scout_16MB.csv
board_build.filesystem = littlefs
build_flags =
  -Wall
  -Wno-missing-field-initializers
  -Wno-format
  -DRNS_USE_FS
  -DUSTORE_USE_LITTLEFS
  -DMSGPACK_USE_BOOST=OFF
  -DBOARD_HAS_PSRAM=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DBOARD_TDECK
  -DWAYPOST_POCKET_ID=\"pocket-1\"
  ; Station ReticulumTransport.destination_hash_hex (lab dev Station)
  -DWAYPOST_STATION_DEST_HASH=\"70a798ca48cfc9e8993fd3442c0ec50c\"
; Shared protocol code (../common) and the patched microReticulum vendored
; in firmware/pocket/lib (its own LoRa driver is replaced by src/radio.*).
lib_extra_dirs =
  ../common
  ../pocket/lib
lib_ignore =
  lora_interface
  TFT_eSPI
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  ArduinoJson@^7.4.2
  MsgPack@^0.4.2
  jgromes/RadioLib@^7.0.0
  https://github.com/attermann/Crypto.git
  https://github.com/attermann/microStore.git
monitor_filters = esp32_exception_decoder
