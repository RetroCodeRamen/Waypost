; PlatformIO — Waypost Outpost: standalone Wi-Fi AP + real Reticulum + Corkboard
; Target: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262) on /dev/ttyUSB1 ONLY.
; Station's own radio on /dev/ttyUSB0 is untouched by this firmware.
;
; Flash:   pio run -e heltec_wifi_lora_32_V3 -t upload --upload-port /dev/ttyUSB1
; Monitor: pio device monitor -p /dev/ttyUSB1 -b 115200
;
; Real Reticulum on-device via microReticulum (attermann/microReticulum,
; Apache-2.0) — see docs/architecture.md and firmware/outpost/README.md for
; why this replaces the earlier plaintext-LoRa draft. lib_deps below mirror
; the exact combination microReticulum's own lora_transport example pins
; (examples/lora_transport/platformio.ini upstream) rather than letting the
; registry resolve an ambiguous "Crypto" dependency on its own.

[env]
framework = arduino
monitor_speed = 115200
build_type = debug
build_flags =
  -Wall
  -Wno-missing-field-initializers
  -Wno-format
  -DRNS_USE_FS
  -DUSTORE_USE_LITTLEFS
  -DMSGPACK_USE_BOOST=OFF
lib_deps =
  ArduinoJson@^7.4.2
  MsgPack@^0.4.2
  jgromes/RadioLib@^7.0.0
  https://github.com/attermann/Crypto.git
  https://github.com/attermann/microStore.git
  attermann/microReticulum@^0.5.0
  olikraus/U8g2@^2.36.18

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
build_flags =
  ${env.build_flags}
  -DMCU_ESP32
  -DBOARD_HELTEC_V3
  ; 32 hex chars: Station's ReticulumTransport.destination_hash_hex, printed
  ; at Station startup. Placeholder until bound — see README "First test".
  -DWAYPOST_STATION_DEST_HASH=\"\"
  -DWAYPOST_OUTPOST_ID=\"outpost-1\"
  -DWAYPOST_AP_SSID=\"WAYPOST-OUTPOST\"
monitor_filters = esp32_exception_decoder
