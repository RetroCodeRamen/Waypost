; PlatformIO — Heltec WiFi LoRa 32 USB↔LoRa Waylink bridge
; Flash: pio run -t upload -e heltec_wifi_lora_32_V3
; Monitor: pio device monitor -b 115200

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@^6.5.0

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
build_flags =
  -D WAYPOST_HELTEC_V3=1
  -D WAYPOST_REGION_US915=1

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
build_flags =
  -D WAYPOST_HELTEC_V2=1
  -D WAYPOST_REGION_US915=1
