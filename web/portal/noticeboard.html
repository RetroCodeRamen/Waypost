<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Noticeboard — Waypost</title>
  <link rel="stylesheet" href="/static/tokens.css"/>
  <link rel="stylesheet" href="/static/shell.css"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div id="wp-page">
    <section class="app-toolbar">
      <label>You <input id="me" value="aj" autocomplete="username"/></label>
      <label>Priority
        <select id="priority">
          <option value="normal">Normal</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </label>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="compose-btn">Post notice</button>
    </section>
    <p class="meta muted" id="status-line">Structured bulletins · not the same as Commons posts</p>

    <div class="app-layout notice-layout">
      <aside class="app-sidebar">
        <ul id="notice-list" class="notice-list"></ul>
      </aside>
      <section class="app-reader">
        <div id="empty" class="muted">Select a notice.</div>
        <article id="detail" hidden>
          <p class="notice-badge" id="d-priority"></p>
          <h2 id="d-title"></h2>
          <p class="meta" id="d-meta"></p>
          <pre id="d-body"></pre>
          <button type="button" id="expire-btn" class="secondary">Expire notice</button>
        </article>
      </section>
    </div>

    <dialog id="compose" class="wp-dialog">
      <form method="dialog" id="compose-form">
        <h3>New notice</h3>
        <label>Title <input id="c-title" required maxlength="160"/></label>
        <label>Body <textarea id="c-body" rows="5" required maxlength="8000"></textarea></label>
        <div class="actions">
          <button type="submit" value="post">Post</button>
          <button type="submit" value="cancel" formnovalidate>Cancel</button>
        </div>
      </form>
    </dialog>
  </div>
  <script src="/static/shell.js"></script>
  <script>
    WaypostShell.mount({
      active: "noticeboard",
      user: "AJ",
      title: "Noticeboard",
      subtitle: "Structured bulletins for the community"
    });
  </script>
  <script src="/static/noticeboard.js"></script>
</body>
</html>
