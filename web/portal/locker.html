<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Locker — Waypost</title>
  <link rel="stylesheet" href="/static/tokens.css"/>
  <link rel="stylesheet" href="/static/shell.css"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div id="wp-page">
    <section class="app-toolbar">
      <label>You <input id="me" value="aj" autocomplete="username"/></label>
      <label>View
        <select id="filter">
          <option value="shared">Shared (everyone)</option>
          <option value="mine">My personal</option>
          <option value="all">Shared + mine</option>
          <option value="group">A group</option>
        </select>
      </label>
      <label id="view-group-field" hidden>Group
        <select id="view-group-id"></select>
      </label>
      <button type="button" id="refresh">Refresh</button>
    </section>

    <form id="upload-form" class="wp-card app-panel locker-upload">
      <h3 class="wp-card__title" style="margin-top:0">Upload</h3>
      <p class="muted" id="limit-hint">Anyone on the Station can download shared files. Max size loads with the list.</p>
      <div class="locker-upload__row">
        <label class="grow">File <input id="file" type="file" required/></label>
        <label>Scope
          <select id="scope">
            <option value="shared">Shared</option>
            <option value="personal">Personal</option>
            <option value="group">Group</option>
          </select>
        </label>
        <label id="group-field" hidden>Group
          <select id="group-id"></select>
        </label>
      </div>
      <label class="grow">Note <input id="note" maxlength="240" placeholder="Optional description"/></label>
      <div class="locker-upload__actions">
        <button type="submit">Upload</button>
      </div>
    </form>

    <div class="wp-card app-panel">
      <p class="meta muted" id="status-line">Loading…</p>
      <ul id="file-list" class="locker-list"></ul>
    </div>
  </div>
  <script src="/static/shell.js"></script>
  <script>
    WaypostShell.mount({
      active: "locker",
      user: "AJ",
      title: "Locker",
      subtitle: "Upload and download community files"
    });
  </script>
  <script src="/static/locker.js"></script>
</body>
</html>
