<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trailhead — Waypost</title>
  <link rel="stylesheet" href="/static/tokens.css"/>
  <link rel="stylesheet" href="/static/shell.css"/>
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="stylesheet" href="/static/fieldbook.css"/>
  <style>
    .th-link { display: block; margin: 0.2rem 0; }
    .th-link::before { content: "→ "; }
    .th-body p { margin: 0.35rem 0; }
    .th-help code { font-size: 0.9em; }
  </style>
</head>
<body>
  <div id="wp-page">
    <section class="app-toolbar">
      <p class="grow meta muted" id="status-line">Short linked pages anyone can read, here or on a Scout over the radio.</p>
      <button type="button" id="new-btn">New page</button>
    </section>

    <div class="app-layout fb-layout">
      <aside class="app-sidebar">
        <p class="fb-side-title">Pages</p>
        <ul id="page-list" class="fb-list"></ul>
      </aside>

      <section class="app-reader fb-reader">
        <div id="empty" class="muted">Pick a page.</div>

        <article id="view" hidden>
          <header class="fb-head">
            <div>
              <h2 id="v-title"></h2>
              <p class="meta" id="v-meta"></p>
            </div>
            <div class="fb-actions">
              <button type="button" id="edit-btn">Edit</button>
              <button type="button" id="delete-btn" class="secondary">Delete</button>
            </div>
          </header>
          <div id="v-body" class="fb-body th-body"></div>
        </article>

        <article id="editor" hidden>
          <header class="fb-head">
            <div>
              <label class="fb-field">Title <input id="e-title" maxlength="80" required/></label>
              <label class="fb-field">Address <input id="e-path" maxlength="64" pattern="[a-z0-9][a-z0-9/_\-]*" required placeholder="camp/rules"/></label>
            </div>
            <div class="fb-actions">
              <button type="button" id="save-btn">Save</button>
              <button type="button" id="cancel-btn" class="secondary">Cancel</button>
            </div>
          </header>
          <p class="meta muted th-help">
            One thing per line: <code># Heading</code>, <code>=&gt; address Link text</code>, or plain text.
            Keep pages short: a Scout loads about 160 bytes every couple of seconds.
            <span id="e-size"></span>
          </p>
          <p class="meta" id="e-error" hidden></p>
          <textarea id="e-body" rows="20" spellcheck="true"></textarea>
        </article>
      </section>
    </div>
  </div>
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js"></script>
  <script>
    WaypostShell.mount({
      active: "trailhead",
      user: "AJ",
      title: "Trailhead",
      subtitle: "The camp's small web"
    });
  </script>
  <script>
  (function () {
    var list = document.getElementById("page-list");
    var empty = document.getElementById("empty");
    var view = document.getElementById("view");
    var editor = document.getElementById("editor");
    var vTitle = document.getElementById("v-title");
    var vMeta = document.getElementById("v-meta");
    var vBody = document.getElementById("v-body");
    var eTitle = document.getElementById("e-title");
    var ePath = document.getElementById("e-path");
    var eBody = document.getElementById("e-body");
    var eSize = document.getElementById("e-size");
    var eError = document.getElementById("e-error");
    var current = null;

    function api(url, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      return WaypostAuth.api(url, opts);
    }

    function pageUrl(path) {
      return "/api/trailhead/pages/" + path.split("/").map(encodeURIComponent).join("/");
    }

    function show(which) {
      empty.hidden = which !== "empty";
      view.hidden = which !== "view";
      editor.hidden = which !== "editor";
    }

    function loadList(select) {
      return api("/api/trailhead/pages").then(function (r) { return r.json(); }).then(function (j) {
        list.innerHTML = "";
        j.pages.forEach(function (p) {
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + p.path;
          a.textContent = p.title;
          var small = document.createElement("span");
          small.className = "muted";
          small.textContent = " " + p.path;
          a.appendChild(small);
          li.appendChild(a);
          list.appendChild(li);
        });
        if (select) open(select);
      });
    }

    function render(body) {
      vBody.innerHTML = "";
      body.split("\n").forEach(function (line) {
        var el;
        var h = line.match(/^(#{1,3})\s+(.*)$/);
        var l = line.match(/^=>\s*(\S+)\s*(.*)$/);
        if (h) {
          el = document.createElement("h" + (h[1].length + 2));
          el.textContent = h[2];
        } else if (l) {
          el = document.createElement("a");
          el.className = "th-link";
          el.href = "#" + l[1];
          el.textContent = l[2] || l[1];
        } else if (line.trim()) {
          el = document.createElement("p");
          el.textContent = line;
        } else {
          return;
        }
        vBody.appendChild(el);
      });
    }

    function open(path) {
      api(pageUrl(path)).then(function (r) {
        if (r.status === 404) {
          current = { path: path, title: "", body: "", isNew: true };
          return startEdit();
        }
        return r.json().then(function (p) {
          current = p;
          vTitle.textContent = p.title;
          vMeta.textContent = p.path + " · " + new Blob([p.body]).size + " bytes · edited by " + p.updated_by;
          render(p.body);
          show("view");
        });
      });
    }

    function updateSize() {
      var n = new Blob([eBody.value]).size;
      eSize.textContent = "(" + n + " bytes ≈ " + Math.max(1, Math.ceil(n / 160)) + " radio round trips)";
    }

    function startEdit() {
      eTitle.value = current.title || "";
      ePath.value = current.path || "";
      ePath.disabled = !current.isNew;
      eBody.value = current.body || "";
      eError.hidden = true;
      updateSize();
      show("editor");
    }

    document.getElementById("new-btn").onclick = function () {
      current = { path: "", title: "", body: "", isNew: true };
      startEdit();
      ePath.focus();
    };
    document.getElementById("edit-btn").onclick = startEdit;
    document.getElementById("cancel-btn").onclick = function () {
      if (current && !current.isNew) show("view"); else show("empty");
    };
    document.getElementById("delete-btn").onclick = function () {
      if (!current || !confirm("Delete \"" + current.title + "\"?")) return;
      api(pageUrl(current.path), { method: "DELETE" }).then(function () {
        location.hash = "";
        show("empty");
        loadList();
      });
    };
    document.getElementById("save-btn").onclick = function () {
      var path = ePath.value.trim();
      api(pageUrl(path), {
        method: "PUT",
        body: JSON.stringify({ title: eTitle.value.trim(), body: eBody.value }),
      }).then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) {
            eError.hidden = false;
            eError.textContent = typeof j.detail === "string" ? j.detail : "Could not save.";
            return;
          }
          location.hash = j.path;
          loadList(j.path);
        });
      });
    };
    eBody.addEventListener("input", updateSize);
    window.addEventListener("hashchange", function () {
      var path = location.hash.slice(1);
      if (path) open(path);
    });

    loadList(location.hash.slice(1) || "home");
  })();
  </script>
</body>
</html>
