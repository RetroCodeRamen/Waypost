<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Commons — Waypost</title>
  <link rel="stylesheet" href="/static/tokens.css"/>
  <link rel="stylesheet" href="/static/shell.css"/>
  <link rel="stylesheet" href="/static/style.css"/>
</head>
<body>
  <div id="wp-page">
    <form id="composer" class="wp-card app-panel commons-composer">
      <div class="commons-compose-row">
        <div class="commons-post__avatar" id="composer-avatar" aria-hidden="true">?</div>
        <div class="commons-compose-main">
          <label class="sr-only" for="body">New post</label>
          <textarea id="body" rows="3" maxlength="4000" placeholder="What's happening at camp?" required></textarea>
          <details class="commons-extra">
            <summary>Optional title</summary>
            <input id="title" placeholder="Title (optional)" maxlength="120"/>
          </details>
        </div>
      </div>
      <div class="commons-composer__actions">
        <span class="muted" id="hint">Everyone on this Station sees the same timeline · newest first</span>
        <div class="commons-composer__right">
          <label class="commons-scope">Post to
            <select id="scope">
              <option value="shared">Everyone</option>
              <option value="group">A group</option>
            </select>
          </label>
          <label id="group-field" hidden>Group
            <select id="group-id"></select>
          </label>
          <button type="submit">Post</button>
        </div>
      </div>
    </form>

    <section class="app-toolbar commons-toolbar">
      <label>Showing
        <select id="filter">
          <option value="shared">Everyone's posts</option>
          <option value="group">A group</option>
        </select>
      </label>
      <label id="view-group-field" hidden>Group
        <select id="view-group-id"></select>
      </label>
      <button type="button" id="refresh">Refresh</button>
    </section>

    <div class="wp-card app-panel">
      <ul id="feed" class="commons-feed" aria-live="polite"></ul>
    </div>
  </div>
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js"></script>
  <script>
    WaypostShell.mount({
      active: "commons",
      user: "AJ",
      title: "Commons",
      subtitle: "Shared timeline for everyone signed in"
    });
  </script>
  <script src="/static/commons.js"></script>
</body>
</html>
