<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Waypost</title>
  <link rel="stylesheet" href="/static/tokens.css"/>
  <link rel="stylesheet" href="/static/shell.css"/>
  <link rel="stylesheet" href="/static/home.css"/>
</head>
<body>
  <div id="wp-page">
    <div id="beacon-banner" class="beacon-banner" hidden>
      <a href="/beacon.html"><strong id="beacon-banner-title">Beacon</strong>
      <span id="beacon-banner-meta"></span></a>
    </div>
    <div class="home-brand-strip" aria-hidden="true"></div>
    <section class="home-cards" aria-label="Status">
      <a class="stat-card accent-dispatch" href="/dispatch.html" data-card="dispatch">
        <div class="stat-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 8h10M5 12h14M5 16h7"/></svg>
        </div>
        <div class="stat-card__value">—</div>
        <div class="stat-card__label">New Messages</div>
        <div class="stat-card__service">Dispatch</div>
      </a>
      <a class="stat-card accent-postbox" href="/postbox.html" data-card="postbox">
        <div class="stat-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="7" width="16" height="11" rx="1.5"/><path d="M4 9l8 5 8-5"/></svg>
        </div>
        <div class="stat-card__value">—</div>
        <div class="stat-card__label">Unread Emails</div>
        <div class="stat-card__service">Postbox</div>
      </a>
      <a class="stat-card accent-commons" href="/commons.html" data-card="commons">
        <div class="stat-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="10" r="2.5"/><circle cx="15" cy="10" r="2.5"/><path d="M5 18c0-3 3-4 4-4s3 1 3 1 2-1 4-1 4 1 4 4"/></svg>
        </div>
        <div class="stat-card__value">—</div>
        <div class="stat-card__label">New Posts</div>
        <div class="stat-card__service">Commons</div>
      </a>
      <a class="stat-card accent-notice" href="/noticeboard.html" data-card="noticeboard">
        <div class="stat-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="4" width="12" height="16" rx="1"/><path d="M9 9h6M9 13h6"/></svg>
        </div>
        <div class="stat-card__value">—</div>
        <div class="stat-card__label">Unread Notices</div>
        <div class="stat-card__service">Noticeboard</div>
      </a>
    </section>

    <section class="home-grid">
      <article class="wp-card home-panel">
        <h2 class="wp-card__title">Recent Activity</h2>
        <ul id="activity-list" class="activity-list">
          <li class="activity-empty muted">Loading activity…</li>
        </ul>
      </article>

      <div class="home-side">
        <article class="wp-card home-panel">
          <h2 class="wp-card__title">Network Status</h2>
          <ul id="network-status" class="network-list">
            <li><span class="dot ok"></span><div><strong>Waypost Station</strong><small>Checking…</small></div></li>
          </ul>
          <a class="text-link" href="/signal.html">View Signal details</a>
        </article>

        <article class="wp-card home-panel">
          <h2 class="wp-card__title">Quick Links</h2>
          <div id="quick-links" class="quick-links"></div>
        </article>

        <p class="home-footnote muted" id="gate-note"></p>
      </div>
    </section>
  </div>

  <script src="/static/shell.js"></script>
  <script src="/static/home.js"></script>
</body>
</html>
