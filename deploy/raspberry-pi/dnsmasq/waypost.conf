# Waypost DHCP/DNS — template (Phase 1)
# Avoid .local; use home.arpa.

interface=wlan0
bind-interfaces
dhcp-authoritative

dhcp-range=10.42.0.50,10.42.0.200,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1

domain=waypost.home.arpa
local=/waypost.home.arpa/
expand-hosts

# Primary portal URL (only resolves for clients using Station DNS on WAYPOST Wi‑Fi).
local=/way.post/
address=/way.post/10.42.0.1
address=/www.way.post/10.42.0.1

address=/waypost.home.arpa/10.42.0.1
address=/waypost/10.42.0.1
address=/postbox.waypost.home.arpa/10.42.0.1
address=/fieldbook.waypost.home.arpa/10.42.0.1
address=/commons.waypost.home.arpa/10.42.0.1
address=/locker.waypost.home.arpa/10.42.0.1
address=/archive.waypost.home.arpa/10.42.0.1
address=/signal.waypost.home.arpa/10.42.0.1

# Captive portal: resolve probe hostnames (captive.apple.com, etc.) to the Station.
# Waygate splash is served over HTTP by Caddy; full openNDS session gating is future work.
address=/#/10.42.0.1
