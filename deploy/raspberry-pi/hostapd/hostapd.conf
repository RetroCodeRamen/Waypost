# Waypost Station access point — template rendered by install.sh.
# @SSID@ / @PSK@ / @COUNTRY@ / @CHANNEL@ are filled in; the PSK lives in
# /etc/waypost/wifi-psk (root only) and never in git.
# WPA2-PSK/CCMP: the Pi's onboard brcmfmac does not reliably support SAE (WPA3) in AP mode.

interface=wlan0
driver=nl80211
ssid=@SSID@
country_code=@COUNTRY@
ieee80211d=1
hw_mode=g
channel=@CHANNEL@
ieee80211n=1
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=@PSK@
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
