# Waypost Station access point — template (Phase 1)
# Interface and country code must match the Pi hardware/region.

interface=wlan0
driver=nl80211
ssid=WAYPOST
hw_mode=g
channel=6
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=changeme-wpa3
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=US
